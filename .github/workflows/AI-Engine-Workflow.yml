name: 🧠 AI Engine Workflow

on:
  workflow_call:
    secrets:
      GH_PAT:
        required: true
      GROQ_API_KEY:
        required: false

permissions:
  contents: write

jobs:
  generate-script:
    name: 🧠 Generate Dialogue Script via Groq
    runs-on: ubuntu-latest
    environment: Dialogue_Generator-AI
    steps:
      - name: 📥 Checkout main (source)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🧠 Run ai_engine.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SCENARIOS_PER_RUN: "1"
        run: python engines/ai_engine.py

      - name: 📤 Push output/scripts/ to Output branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          if git ls-remote --exit-code --heads origin Output >/dev/null 2>&1; then
            git checkout -B Output origin/Output
          else
            echo "[*] Creating Output branch from main."
            git checkout -B Output
          fi
          git add -f output/scripts/
          if git diff --cached --quiet; then
            echo "[*] Nothing new to commit."
          else
            git commit -m "🧠 auto: generated dialogue script [skip ci]"
            git push origin Output
            echo "[+] output/scripts/ → Output branch."
          fi