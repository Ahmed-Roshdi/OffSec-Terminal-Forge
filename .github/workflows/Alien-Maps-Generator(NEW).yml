name: 🌍 Alien Maps Generator

on:
  workflow_call:
    secrets:
      GH_PAT:
        required: true

permissions:
  contents: write

jobs:
  generate-map:
    name: 🌍 Generate Alien Sector Map
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: 🌍 Run alien_generator.py
        run: python engines/alien_generator.py

      - name: 📤 Commit output/maps/ to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Rebase on latest main — prevents conflicts when jobs run sequentially
          git pull --rebase origin main

          # Force-add bypasses output/ in .gitignore
          git add -f output/maps/

          if git diff --cached --quiet; then
            echo "[*] Nothing new to commit in output/maps/."
          else
            git commit -m "🌍 auto: generated alien sector map [skip ci]"
            git push origin main
            echo "[+] output/maps/ pushed to main."
          fi