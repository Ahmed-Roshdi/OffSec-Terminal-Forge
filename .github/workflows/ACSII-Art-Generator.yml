name: 🎨 ASCII Art Generator

on:
  workflow_call:
    secrets:
      GH_PAT:
        required: true

permissions:
  contents: write

jobs:
  generate-ascii:
    name: 🎨 Generate ASCII Art → output/ascii/
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout main (source + assets)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🎨 Run ascii_generator.py
        run: python engines/ascii_generator.py

      - name: 🔍 Verify ASCII output
        run: |
          COUNT=$(find output/ascii -name "ascii_art_*.txt" 2>/dev/null | wc -l | tr -d ' ')
          echo "[*] ASCII files in output/ascii/: $COUNT"
          [ "$COUNT" -gt 0 ] || { echo "[!] No ASCII output generated."; exit 1; }

      - name: 📤 Push output/ascii/ to Output branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          if git ls-remote --exit-code --heads origin Output >/dev/null 2>&1; then
            git checkout -B Output origin/Output
          else
            echo "[*] Creating Output branch from main."
            git checkout -B Output
          fi
          git add -f output/ascii/
          if git diff --cached --quiet; then
            echo "[*] Nothing new to commit."
          else
            git commit -m "🎨 auto: generated ASCII art [skip ci]"
            git push origin Output
            echo "[+] output/ascii/ → Output branch."
          fi