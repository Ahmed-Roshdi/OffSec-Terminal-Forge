name: 🎨 ASCII Art Generator

on:
  workflow_call:
    secrets:
      GH_PAT:
        required: true

permissions:
  contents: write

jobs:
  generate-ascii:
    name: 🎨 Generate ASCII Art → output/ascii/
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎨 Run ascii_generator.py
        # ascii_generator.py handles its own graceful fallback:
        #   - Prefers assets/ASCII.txt (the sacred garden sanctuary)
        #   - Falls back to built-in cyberpunk banner if file is missing
        #   - Always produces output/ascii/ascii_art_{ts}.txt
        #   - Always updates output/ascii/latest_ascii.txt
        run: python engines/ascii_generator.py

      - name: 🔍 Verify ASCII output was created
        run: |
          COUNT=$(find output/ascii -name "ascii_art_*.txt" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "[*] ASCII files in output/ascii/: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "[!] No ASCII output found — ascii_generator.py may have failed."
            exit 1
          fi
          echo "[+] Latest output:"
          cat output/ascii/latest_ascii.txt | head -20

      - name: 📤 Commit output/ascii/ to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add -f output/ascii/
          if git diff --cached --quiet; then
            echo "[*] Nothing new to commit in output/ascii/."
          else
            git commit -m "🎨 auto: generated ASCII art asset [skip ci]"
            git push origin main
            echo "[+] output/ascii/ pushed to main."
          fi