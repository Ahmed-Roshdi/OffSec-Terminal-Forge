name: ⚙️ Core Engine (The Compilor)

on:
  workflow_call:
    secrets:
      GH_PAT:
        required: true

permissions:
  contents: write

jobs:
  compile-map:
    name: ⚙️ Apply Glitch Effects to Base Map
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      # The base map (assets/map.png) is required. If it's missing, the engine
      # skips gracefully rather than failing the whole pipeline.
      - name: 🔍 Check base map asset readiness
        id: check
        run: |
          if [ -f "assets/map.png" ]; then
            echo "READY=true"  >> "$GITHUB_ENV"
            echo "[+] assets/map.png found — core engine ready."
          else
            echo "READY=false" >> "$GITHUB_ENV"
            echo "[*] assets/map.png missing — skipping core engine."
            echo "    → Add your base earth map at assets/map.png to activate."
          fi

      - name: ⚙️ Run core_engine.py
        if: env.READY == 'true'
        run: python engines/core_engine.py

      - name: 📤 Commit glitched map to main
        if: env.READY == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add -f output/maps/
          if git diff --cached --quiet; then
            echo "[*] Nothing new to commit in output/maps/."
          else
            git commit -m "⚙️ auto: compiled glitched map [skip ci]"
            git push origin main
            echo "[+] Glitched map pushed to main."
          fi

      - name: ⏭️ Asset missing — skipped
        if: env.READY == 'false'
        run: echo "[*] Core Engine skipped. Place assets/map.png to activate."