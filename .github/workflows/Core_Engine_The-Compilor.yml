name: ⚙️ Core Engine (The Compilor)

on:
  workflow_call:
    secrets:
      GH_PAT:
        required: true

permissions:
  contents: write

jobs:
  compile-map:
    name: ⚙️ SVG Parse → Islamic Map + Glitch
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout main (source + assets)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🔍 Check SVG asset exists
        id: check
        run: |
          if [ -f "assets/islamic_world_map.svg" ]; then
            echo "READY=true"  >> "$GITHUB_ENV"
            echo "[+] assets/islamic_world_map.svg found."
          else
            echo "READY=false" >> "$GITHUB_ENV"
            echo "[*] assets/islamic_world_map.svg missing — skipping."
          fi

      - name: ⚙️ Run core_engine.py
        if: env.READY == 'true'
        run: python engines/core_engine.py

      - name: 📤 Push output/maps/ to Output branch
        if: env.READY == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          if git ls-remote --exit-code --heads origin Output >/dev/null 2>&1; then
            git checkout -B Output origin/Output
          else
            echo "[*] Creating Output branch from main."
            git checkout -B Output
          fi
          git add -f output/maps/
          if git diff --cached --quiet; then
            echo "[*] Nothing new to commit."
          else
            git commit -m "⚙️ auto: compiled Islamic map glitch [skip ci]"
            git push origin Output
            echo "[+] output/maps/ → Output branch."
          fi

      - name: ⏭️ SVG missing — skipped
        if: env.READY == 'false'
        run: echo "[*] Place assets/islamic_world_map.svg to activate Core Engine."