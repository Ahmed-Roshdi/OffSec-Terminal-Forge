name: 🧠 Master Workflow (State Controller)

on:
  schedule:
    - cron: '0 8,16,0 * * *'   # 08:00, 16:00, 00:00 UTC — 3× per day
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:

  # ── JOB 1: Count assets on Output branch, decide what runs ────────────────
  analyze-state:
    name: 📊 Analyze Asset State
    runs-on: ubuntu-latest
    environment: Dialogue_Generator-AI
    outputs:
      run_maps:     ${{ steps.count.outputs.run_maps }}
      run_ai:       ${{ steps.count.outputs.run_ai }}
      run_dialogue: ${{ steps.count.outputs.run_dialogue }}
      run_core:     ${{ steps.count.outputs.run_core }}
      run_ascii:    ${{ steps.count.outputs.run_ascii }}
      maps:         ${{ steps.count.outputs.maps }}
      scripts:      ${{ steps.count.outputs.scripts }}
      dialogues:    ${{ steps.count.outputs.dialogues }}
      ascii:        ${{ steps.count.outputs.ascii }}

    steps:
      - name: 📥 Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      # Load the output/ tree from Output branch so we can count existing assets.
      # output/ is gitignored on main, so we must pull it from Output.
      - name: 📥 Load output/ counts from Output branch
        run: |
          git fetch origin
          if git ls-remote --exit-code --heads origin Output >/dev/null 2>&1; then
            git checkout origin/Output -- output/ 2>/dev/null || true
            echo "[+] Loaded output/ from Output branch."
          else
            echo "[*] Output branch does not exist yet — all counts start at 0."
          fi

      - name: 📊 Count assets and set decision outputs
        id: count
        run: |
          MAPS=$(find output/maps -name "alien_sector_*.webp"  -type f 2>/dev/null | wc -l | tr -d ' ')
          SCRIPTS=$(find output/scripts -name "script_*.json"  -type f 2>/dev/null | wc -l | tr -d ' ')
          DIALOGUES=$(find output/dialogues -name "dialogue_seq_*.webp" -type f 2>/dev/null | wc -l | tr -d ' ')
          ASCII=$(find output/ascii -name "ascii_art_*.txt"    -type f 2>/dev/null | wc -l | tr -d ' ')
          SVG_EXISTS=$( [ -f "assets/islamic_world_map.svg" ] && echo "true" || echo "false" )

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  📂 Asset state on Output branch"
          echo "  Maps       : $MAPS"
          echo "  Scripts    : $SCRIPTS"
          echo "  Dialogues  : $DIALOGUES"
          echo "  ASCII art  : $ASCII"
          echo "  SVG map    : $SVG_EXISTS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Maps: generate when maps ≤ scripts (maps need to lead or balance)
          [ "$MAPS" -le "$SCRIPTS" ] && RUN_MAPS="true" || RUN_MAPS="false"

          # AI: generate when scripts == 0 OR maps are ahead
          if [ "$SCRIPTS" -eq 0 ] || [ "$MAPS" -gt "$SCRIPTS" ]; then
            RUN_AI="true"
          else
            RUN_AI="false"
          fi

          # Dialogue: render when dialogues == 0 OR scripts are ahead
          if [ "$DIALOGUES" -eq 0 ] || [ "$SCRIPTS" -gt "$DIALOGUES" ]; then
            RUN_DIALOGUE="true"
          else
            RUN_DIALOGUE="false"
          fi

          [ "$SVG_EXISTS" = "true" ] && RUN_CORE="true" || RUN_CORE="false"
          RUN_ASCII="true"

          echo "  ─────────────────────────────────────────────"
          echo "  🔵 run_maps     : $RUN_MAPS"
          echo "  🟣 run_ai       : $RUN_AI"
          echo "  🟢 run_dialogue : $RUN_DIALOGUE"
          echo "  ⚙️  run_core     : $RUN_CORE"
          echo "  🎨 run_ascii    : $RUN_ASCII"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "run_maps=$RUN_MAPS"         >> "$GITHUB_OUTPUT"
          echo "run_ai=$RUN_AI"             >> "$GITHUB_OUTPUT"
          echo "run_dialogue=$RUN_DIALOGUE" >> "$GITHUB_OUTPUT"
          echo "run_core=$RUN_CORE"         >> "$GITHUB_OUTPUT"
          echo "run_ascii=$RUN_ASCII"       >> "$GITHUB_OUTPUT"
          echo "maps=$MAPS"                 >> "$GITHUB_OUTPUT"
          echo "scripts=$SCRIPTS"           >> "$GITHUB_OUTPUT"
          echo "dialogues=$DIALOGUES"       >> "$GITHUB_OUTPUT"
          echo "ascii=$ASCII"               >> "$GITHUB_OUTPUT"

  # ── Sequential pipeline — each job waits for the previous ─────────────────
  # All jobs push to Output branch. Sequential order prevents push conflicts.

  generate-maps:
    name: 🌍 Alien Maps Generator
    needs: analyze-state
    if: needs.analyze-state.outputs.run_maps == 'true'
    uses: ./.github/workflows/Alien-Maps-Generator.yml
    secrets: inherit

  generate-scripts:
    name: 🧠 AI Engine Workflow
    needs: [analyze-state, generate-maps]
    if: |
      always() &&
      needs.analyze-state.result == 'success' &&
      (needs.generate-maps.result == 'success' || needs.generate-maps.result == 'skipped') &&
      needs.analyze-state.outputs.run_ai == 'true'
    uses: ./.github/workflows/AI-Engine-Workflow.yml
    secrets: inherit

  render-dialogues:
    name: 🎬 Orchestrator (Render)
    needs: [analyze-state, generate-maps, generate-scripts]
    if: |
      always() &&
      needs.analyze-state.result == 'success' &&
      (needs.generate-maps.result == 'success' || needs.generate-maps.result == 'skipped') &&
      (needs.generate-scripts.result == 'success' || needs.generate-scripts.result == 'skipped') &&
      needs.analyze-state.outputs.run_dialogue == 'true'
    uses: ./.github/workflows/Orchestrator.yml
    secrets: inherit

  # Core engine after main chain — sequential to avoid Output branch conflicts
  compile-core:
    name: ⚙️ Core Engine (The Compilor)
    needs: [analyze-state, render-dialogues]
    if: |
      always() &&
      needs.analyze-state.result == 'success' &&
      (needs.render-dialogues.result == 'success' || needs.render-dialogues.result == 'skipped') &&
      needs.analyze-state.outputs.run_core == 'true'
    uses: ./.github/workflows/Core_Engine_The-Compilor.yml
    secrets: inherit

  # ASCII last in the chain — always runs (engine has its own fallback)
  generate-ascii:
    name: 🎨 ASCII Art Generator
    needs: [analyze-state, compile-core]
    if: |
      always() &&
      needs.analyze-state.result == 'success' &&
      (needs.compile-core.result == 'success' || needs.compile-core.result == 'skipped')
    uses: ./.github/workflows/ACSII-Art-Generator.yml
    secrets: inherit

  summary:
    name: 📋 Pipeline Summary
    needs: [analyze-state, generate-maps, generate-scripts, render-dialogues, compile-core, generate-ascii]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📋 Results
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🧠 Master Workflow — Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  analyze-state    : ${{ needs.analyze-state.result }}"
          echo "  generate-maps    : ${{ needs.generate-maps.result }}"
          echo "  generate-scripts : ${{ needs.generate-scripts.result }}"
          echo "  render-dialogues : ${{ needs.render-dialogues.result }}"
          echo "  compile-core     : ${{ needs.compile-core.result }}"
          echo "  generate-ascii   : ${{ needs.generate-ascii.result }}"
          echo "  ─────────────────────────────────────────────"
          echo "  All outputs committed to → Output branch"
          echo "  main branch unchanged    ✅"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"