name: 🌍 Alien Maps Generator

on:
  workflow_call:
    secrets:
      GH_PAT:
        required: true

permissions:
  contents: write

jobs:
  generate-map:
    name: 🌍 Generate Alien Sector Map
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout main (source)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🌍 Run alien_generator.py
        run: python engines/alien_generator.py

      - name: 📤 Push output/maps/ to Output branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          if git ls-remote --exit-code --heads origin Output >/dev/null 2>&1; then
            git checkout -B Output origin/Output
          else
            echo "[*] Creating Output branch from main."
            git checkout -B Output
          fi
          git add -f output/maps/
          if git diff --cached --quiet; then
            echo "[*] Nothing new to commit."
          else
            git commit -m "🌍 auto: generated alien sector map [skip ci]"
            git push origin Output
            echo "[+] output/maps/ → Output branch."
          fi