name: 🎬 Orchestrator (Dialogue Renderer)

on:
  # Called by Master-Workflow after AI-Engine-Workflow completes
  workflow_call:
    secrets:
      GH_PAT:
        required: true

  # Also triggerable manually for standalone render pass
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-dialogue:
    name: 🎬 Render Script → Animated WebP
    runs-on: ubuntu-latest
    environment: Dialogue_Generator-AI

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      # Verify a script exists before attempting to render.
      # dialogue_generator.py has a built-in fallback, but logging this
      # explicitly makes it clear in the Action logs what source was used.
      - name: 🔍 Check for script files
        run: |
          COUNT=$(find output/scripts -name "script_*.json" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "[*] Found $COUNT script file(s) in output/scripts/."
          if [ "$COUNT" -eq 0 ]; then
            echo "[!] No scripts found — dialogue_generator.py will use its built-in fallback dialogue."
          else
            LATEST=$(find output/scripts -name "script_*.json" -type f | sort | tail -1)
            echo "[+] Will render: $(basename $LATEST)"
          fi

      - name: 🎬 Run dialogue_generator.py (render engine)
        run: python engines/dialogue_generator.py

      - name: 📤 Commit output/dialogues/ to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add -f output/dialogues/
          if git diff --cached --quiet; then
            echo "[*] Nothing new to commit in output/dialogues/."
          else
            git commit -m "🎬 auto: rendered dialogue animation [skip ci]"
            git push origin main
            echo "[+] output/dialogues/ pushed to main."
          fi

      - name: ✅ Confirm output
        run: |
          WEBP=$(find output/dialogues -name "*.webp" -type f 2>/dev/null | wc -l)
          echo "[+] output/dialogues/ now contains $WEBP WebP file(s)."
          ls -lh output/dialogues/ 2>/dev/null || echo "(directory not found)"