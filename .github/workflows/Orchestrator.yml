name: 🎬 Orchestrator (Dialogue Renderer)

on:
  workflow_call:
    secrets:
      GH_PAT:
        required: true
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-dialogue:
    name: 🎬 Render Script → Animated WebP
    runs-on: ubuntu-latest
    environment: Dialogue_Generator-AI
    steps:
      - name: 📥 Checkout main (source)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      # Pull output/scripts/ from Output branch so dialogue_generator can find scripts
      - name: 📥 Fetch scripts from Output branch
        run: |
          git fetch origin
          if git ls-remote --exit-code --heads origin Output >/dev/null 2>&1; then
            git checkout origin/Output -- output/scripts/ 2>/dev/null || true
            git checkout origin/Output -- output/maps/    2>/dev/null || true
            echo "[+] Loaded scripts and maps from Output branch."
          else
            echo "[*] Output branch not yet created — no prior scripts to load."
          fi

      - name: 🎬 Run dialogue_generator.py
        run: python engines/dialogue_generator.py

      - name: 📤 Push output/dialogues/ to Output branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          if git ls-remote --exit-code --heads origin Output >/dev/null 2>&1; then
            git checkout -B Output origin/Output
          else
            echo "[*] Creating Output branch from main."
            git checkout -B Output
          fi
          git add -f output/dialogues/
          if git diff --cached --quiet; then
            echo "[*] Nothing new to commit."
          else
            git commit -m "🎬 auto: rendered dialogue animation [skip ci]"
            git push origin Output
            echo "[+] output/dialogues/ → Output branch."
          fi