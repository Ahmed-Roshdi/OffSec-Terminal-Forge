name: 🧠 AI Engine Workflow

on:
  workflow_call:
    secrets:
      GH_PAT:
        required: true
      GROQ_API_KEY:
        required: false

permissions:
  contents: write

jobs:
  generate-script:
    name: 🧠 Generate Dialogue Script via Groq
    runs-on: ubuntu-latest
    environment: Dialogue_Generator-AI

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🧠 Run ai_engine.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SCENARIOS_PER_RUN: "1"
        run: python engines/ai_engine.py

      - name: 📤 Commit output/scripts/ to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add -f output/scripts/
          if git diff --cached --quiet; then
            echo "[*] Nothing new to commit in output/scripts/."
          else
            git commit -m "🧠 auto: generated dialogue script [skip ci]"
            git push origin main
            echo "[+] output/scripts/ pushed to main."
          fi