name: 📚 Auto-Update Documentation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-docs:
    name: 🔄 Generate README + DEVELOP → Output branch
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout main (source + PROJECT_MEMORY.md)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🔍 Verify PROJECT_MEMORY.md exists
        run: |
          [ -f "PROJECT_MEMORY.md" ] || { echo "[!] PROJECT_MEMORY.md missing."; exit 1; }
          echo "[+] PROJECT_MEMORY.md found ($(wc -c < PROJECT_MEMORY.md) bytes)."

      - name: 🧠 Run doc_updater.py
        env:
          AI_Auto_Projrct_Information_Updater: ${{ secrets.AI_Auto_Projrct_Information_Updater }}
        run: python engines/doc_updater.py

      - name: 📤 Push README.md + DEVELOP.md to Output branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          if git ls-remote --exit-code --heads origin Output >/dev/null 2>&1; then
            git checkout -B Output origin/Output
          else
            echo "[*] Creating Output branch from main."
            git checkout -B Output
          fi
          git add README.md DEVELOP.md
          if git diff --cached --quiet; then
            echo "[*] Documentation unchanged."
          else
            git commit -m "docs: auto-update README and DEVELOP [skip ci]"
            git push origin Output
            echo "[+] README.md + DEVELOP.md → Output branch."
          fi