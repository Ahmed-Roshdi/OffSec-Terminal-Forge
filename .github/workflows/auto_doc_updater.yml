name: 📚 Auto-Update Documentation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-docs:
    name: 🔄 Generate & Push README + DEVELOP
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Verify PROJECT_MEMORY.md exists
        run: |
          if [ ! -f "PROJECT_MEMORY.md" ]; then
            echo "[!] PROJECT_MEMORY.md not found at repo root."
            echo "    doc_updater.py requires this file for architecture context."
            exit 1
          fi
          echo "[+] PROJECT_MEMORY.md found ($(wc -c < PROJECT_MEMORY.md) bytes)."

      - name: 🧠 Run doc_updater.py
        env:
          AI_Auto_Projrct_Information_Updater: ${{ secrets.AI_Auto_Projrct_Information_Updater }}
        run: python engines/doc_updater.py

      - name: 📤 Commit README.md and DEVELOP.md to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add README.md DEVELOP.md
          if git diff --cached --quiet; then
            echo "[*] Documentation unchanged — nothing to commit."
          else
            git commit -m "docs: auto-update README and DEVELOP [skip ci]"
            git push origin main
            echo "[+] Documentation pushed to main."
          fi